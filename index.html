<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Site</title>
</head>
<body>
    <section class="landing">
        <header class="header">
            <div class="logo">EQUAL audio</div>
            <div class="toggle"></div>
        </header>

        <div class="background"></div>

        <div class="text">
            <h1>We Create Sound</h1>
            <h2>Music and recording studio</h2>
            <!-- <a href class="button">Get in touch</a> -->
            <a href class="button"></a>
        </div>

        <ul class="socials">
            <li><a href=""www.instagram.com>
                <img src="images/instagram2.png" alt="Instagram">
            </a></li>
            <li><a href=""www.spotify.com>
                <img src="images/spotify2.png" alt="Spotify">
            </a></li>
            <li><a href=""www.Linkedin.com>
                <img src="images/linkedin2.png" alt="Linkedin">
            </a></li>            
        </ul>
    </section>

    <ul class="menu">
        <li>Home</li>
        <li>Work</li>
        <li>About</li>
        <li>Contact</li>
    </ul>

    <section class="portfolio">
        <div class="titleportfolio">WORK</div>
        <div class="portfolioitems">
            <div class="item">
                <img class="foto" src="images/royal.jpg" alt="">
                <div class="name">Royal Canin</div>
            </div>
            <div class="item">
                <img class="foto" src="images/ritex.jpg" alt="">
                <div class="name">Ritex</div>
            </div>
            <div class="item">
                <img class="foto" src="images/kbw.webp" alt="">
                <div class="name">Kinderboekenweek</div>
            </div>
            <div class="item">
                <img class="foto" src="images/royal.jpg" alt="">
                <div class="name">Royal Canin</div>
            </div>
            <div class="item">
                <img class="foto" src="images/ritex.jpg" alt="">
                <div class="name">Ritex</div>
            </div>
            <div class="item">
                <img class="foto" src="images/kbw.webp" alt="">
                <div class="name">Kinderboekenweek</div>
            </div>
        </div>
    </section>

    <script>
        const landing = document.querySelector('.landing');
        const toggle = document.querySelector('.toggle');

        toggle.addEventListener('click', () => {
            landing.classList.toggle('active');
            toggle.classList.toggle('active');
        });
    </script>

</body>
</html>
